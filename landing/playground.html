<main>
<div class="playground">
<h1>Playground</h1>
<p class="sub">Paste HTML, get a PDF. Uses the <code>/convert/public</code> endpoint. <a href="/docs">Read the docs</a> for all options.</p>

<div class="playground-grid">
<textarea id="html-input" rows="16" placeholder='<html>
<head><style>
h1 { color: #6366f1; }
.card { padding: 20px; border: 1px solid #ddd; }
</style></head>
<body>
<h1>Invoice #1234</h1>
<div class="card">
<p><strong>Item:</strong> Web Development</p>
<p><strong>Amount:</strong> $1,500.00</p>
</div>
</body>
</html>'></textarea>
<div class="playground-output">
<div id="pdf-preview" style="display:none;width:100%">
<embed id="pdf-embed" type="application/pdf" style="width:100%;height:340px;border-radius:4px" />
</div>
<div id="pdf-placeholder" class="placeholder">PDF preview</div>
</div>
</div>

<div class="playground-controls">
<button id="convert-btn" class="convert-btn" onclick="convertWeb()">Convert to PDF</button>
<button id="download-btn" class="download-btn" onclick="downloadPdf()">Download</button>
</div>
<div id="convert-status"></div>
</div>
</main>
